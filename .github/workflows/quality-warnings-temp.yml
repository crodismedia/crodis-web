name: Quality Warnings Temp

on:
  push:
    paths:
      - '.github/workflows/quality-warnings-temp.yml'

permissions:
  contents: read

jobs:
  warnings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Quality Guard and print warnings
        run: |
          node quality-guard.cjs >/tmp/qg.out 2>&1
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const dir = 'quality-reports';
          const reports = fs.readdirSync(dir).filter(f => f.endsWith('.json')).sort();
          const report = JSON.parse(fs.readFileSync(path.join(dir, reports.at(-1)), 'utf8'));
          const issues = report.issues || [];
          const warnings = issues.filter(i => i.severity === 'warning');
          console.log('WARNINGS_JSON_START');
          console.log(JSON.stringify(warnings, null, 2));
          console.log('WARNINGS_JSON_END');
          NODE
