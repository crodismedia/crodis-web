name: Validate static site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript, HTML and local links
        run: node scripts/validate-site.mjs

      - name: Run TallerMap Quality Guard
        run: npm run quality:ci

      - name: Check production image alt attributes
        run: npm run diagnostico-alt:prod

      - name: Verify Vercel HTML alt attributes and cache headers
        run: npm run verify-alt:vercel

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check active Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/buscar-talleres-internet/index.ts
