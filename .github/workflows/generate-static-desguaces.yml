name: Generar desguaces estáticos

on:
  push:
    paths:
      - '.github/workflows/generate-static-desguaces.yml'
      - 'scripts/generate-static-desguaces.mjs'
      - 'scripts/generate-static-desguaces-index.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generar fichas estáticas de desguaces
        run: node scripts/generate-static-desguaces.mjs
      - name: Generar directorio estático de desguaces
        run: node scripts/generate-static-desguaces-index.mjs
      - name: Verificar 79 fichas e indexabilidad
        shell: bash
        run: |
          count=$(find desguace -mindepth 2 -maxdepth 2 -type f -name 'index.html' | wc -l)
          echo "Fichas estáticas encontradas: $count"
          test "$count" -eq 79
          if grep -RIl '<meta name="robots" content="noindex' desguace --include='index.html'; then
            echo 'ERROR: hay fichas de desguace con noindex'
            exit 1
          fi
          if grep -Eq 'desguaces-publico\.js|supabase-js@|js/supabase\.js' desguaces.html; then
            echo 'ERROR: quedan restos de carga dinámica en desguaces.html'
            exit 1
          fi
          grep -q '79 desguaces publicados' desguaces.html
      - name: Depositar contenido estático en el repositorio
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desguace/ desguaces.html
          if git diff --cached --quiet; then
            echo 'El contenido estático ya está actualizado.'
            exit 0
          fi
          git commit -m 'Generate static scrapyard directory and 79 pages'
          git push

# Regeneración solicitada: enlaces de texto en fichas de desguaces.
