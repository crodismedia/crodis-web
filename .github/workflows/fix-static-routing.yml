name: Fix static routing

on:
  push:
    paths:
      - '.github/workflows/fix-static-routing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Quitar routes legacy y usar rewrites normales
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='vercel.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          delete j.routes;
          const rest=(j.rewrites||[]).filter(r => r.source !== '/' && r.source !== '/municipios' && r.source !== '/municipios/');
          j.rewrites=[
            {source:'/',destination:'/index.html'},
            {source:'/municipios',destination:'/api/municipios-index'},
            {source:'/municipios/',destination:'/api/municipios-index'},
            ...rest
          ];
          fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');
          NODE
          grep -n '"routes"' vercel.json && exit 1 || true
          grep -n '"source": "/"' vercel.json
          test -f index.html
      - name: Depositar corrección
        shell: bash
        run: |
          rm -f .github/workflows/fix-static-routing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix static filesystem routing'
          git push
