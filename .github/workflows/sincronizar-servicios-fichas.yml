name: Sincronizar servicios de fichas en municipios

on:
  push:
    paths:
      - '.github/workflows/sincronizar-servicios-fichas.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar data-servicios desde las fichas individuales
        run: npm run sincronizar:servicios-municipios
      - name: Comprobar cambios
        run: git diff --check
      - name: Guardar HTML municipales actualizados
        run: |
          if git diff --quiet -- municipios; then
            echo "No hay cambios municipales que guardar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add municipios/*.html
          git commit -m "Sincronizar servicios completos de fichas en municipios"
          git push
