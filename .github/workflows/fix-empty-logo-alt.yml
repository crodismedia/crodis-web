name: Fix empty logo alt manual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar corrección solo en el entorno temporal
        run: node scripts/fix-empty-logo-alt.mjs
