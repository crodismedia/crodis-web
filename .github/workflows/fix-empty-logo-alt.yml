name: Corregir alt vacíos de logos

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-empty-logo-alt.mjs'
      - '.github/workflows/fix-empty-logo-alt.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Corregir alt vacíos informativos
        run: node scripts/fix-empty-logo-alt.mjs

      - name: Guardar correcciones
        shell: bash
        run: |
          git config user.name 'TallerMap Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add '*.html' pages provincias servicios templates coches 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No hay cambios que guardar.'
          else
            git commit -m 'Corregir alt vacíos informativos de logos TallerMap'
            git push
          fi
