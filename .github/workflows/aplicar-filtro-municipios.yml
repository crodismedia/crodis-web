name: Aplicar filtro de municipios con talleres

on:
  push:
    paths:
      - '.github/workflows/aplicar-filtro-municipios.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Filtrar municipios sin talleres
        run: node scripts/filtrar-municipios-con-talleres.mjs --write
      - name: Guardar cambios
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No hay cambios que guardar"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add municipios/index.html js/catalogo-municipios-estatico.js
          git commit -m "Mostrar solo municipios con talleres"
          git push
