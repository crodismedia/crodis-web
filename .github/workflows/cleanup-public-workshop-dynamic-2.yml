name: Limpiar renderizadores públicos restantes de talleres

on:
  push:
    paths:
      - 'scripts/cleanup-public-workshop-dynamic-2.mjs'
      - '.github/workflows/cleanup-public-workshop-dynamic-2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Limpiar renderizadores restantes
        run: node scripts/cleanup-public-workshop-dynamic-2.mjs
      - name: Verificar fichas temporales
        shell: bash
        run: |
          count=$(find talleres-temporal -mindepth 2 -maxdepth 2 -type f -name 'index.html' | wc -l)
          echo "Fichas temporales: $count"
          test "$count" -gt 0
      - name: Depositar y retirar herramienta
        shell: bash
        run: |
          rm -f scripts/cleanup-public-workshop-dynamic-2.mjs
          rm -f .github/workflows/cleanup-public-workshop-dynamic-2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove remaining dynamic public workshop renderers'
          git push
