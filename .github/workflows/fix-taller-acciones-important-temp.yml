name: Fix Taller Acciones Important Temp

on:
  push:
    paths:
      - '.github/workflows/fix-taller-acciones-important-temp.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reduce unnecessary important rules
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'css/taller-acciones.css';
          let content = fs.readFileSync(file, 'utf8');
          let kept = 0;
          content = content.replace(/color: #fff !important;/g, () => {
            kept++;
            return `color: #fff __TM_IMPORTANT_${kept}__;`;
          });
          if (kept !== 3) throw new Error(`Se esperaban 3 colores protegidos y se encontraron ${kept}`);
          content = content.replace(/\s*!important/g, '');
          for (let i = 1; i <= 3; i++) content = content.replace(`__TM_IMPORTANT_${i}__`, '!important');
          fs.writeFileSync(file, content);
          NODE
      - name: Commit fix
        run: |
          git config user.name "TallerMap CSS Fix"
          git config user.email "actions@users.noreply.github.com"
          git add css/taller-acciones.css
          git commit -m "Reducir important en acciones de taller"
          git pull --rebase origin main
          git push origin HEAD:main
