name: SEO Audit Temp

on:
  push:
    paths:
      - '.github/workflows/seo-audit-temp.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
      - name: Run SEO Auditor
        run: |
          cp seo-auditor.js /tmp/seo-auditor.cjs
          node /tmp/seo-auditor.cjs --prod --full
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-reports
          path: seo-reports/
