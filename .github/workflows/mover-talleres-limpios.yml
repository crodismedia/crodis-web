name: Mover fichas limpias a talleres

on:
  push:
    paths:
      - '.github/workflows/mover-talleres-limpios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar origen temporal
        shell: bash
        run: |
          set -euo pipefail
          test -d talleres-temporal
          temporal=$(find talleres-temporal -mindepth 2 -maxdepth 2 -type f -name 'index.html' | wc -l)
          echo "Fichas limpias temporales: $temporal"
          test "$temporal" -gt 0

      - name: Vaciar talleres y pasar fichas limpias
        shell: bash
        run: |
          set -euo pipefail
          temporal=$(find talleres-temporal -mindepth 2 -maxdepth 2 -type f -name 'index.html' | wc -l)
          rm -rf talleres
          mkdir -p talleres
          find talleres-temporal -mindepth 1 -maxdepth 1 -type d -exec cp -a {} talleres/ \;
          final=$(find talleres -mindepth 2 -maxdepth 2 -type f -name 'index.html' | wc -l)
          echo "Temporal: $temporal"
          echo "Final: $final"
          test "$final" -eq "$temporal"

      - name: Verificar fichas finales limpias
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'noindex|/api/|taller-public|taller-html|home-cache-fix|crearTarjeta|home-public\.js|busqueda-url\.js|js/supabase\.js' talleres --include='index.html'; then
            echo 'ERROR: se encontraron restos dinámicos o noindex en talleres/'
            exit 1
          fi
          grep -RLi '<meta name="robots" content="index,follow' talleres --include='index.html' | grep . && { echo 'ERROR: hay fichas sin index,follow'; exit 1; } || true

      - name: Retirar carpeta temporal y depositar cambio
        shell: bash
        run: |
          set -euo pipefail
          rm -rf talleres-temporal
          rm -f .github/workflows/mover-talleres-limpios.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace workshop directory with clean static pages'
          git push
