name: Actualizar SEO municipios en rama de revision

on:
  push:
    branches: [seo-municipios-revision]
    paths:
      - 'scripts/update-municipio-meta-seo.mjs'
      - '.github/workflows/update-municipio-meta-seo.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-municipios-revision
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actualizar metadescripciones de municipios indexables
        run: node scripts/update-municipio-meta-seo.mjs
      - name: Validar carpeta municipios
        run: node scripts/guardian-folder.mjs --folder=municipios --strict
      - name: Guardar cambios en la rama
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- municipios)" ]; then
            echo "No hay cambios pendientes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add municipios
          git commit -m 'Actualizar SEO local de municipios indexables'
          git push origin HEAD:seo-municipios-revision
