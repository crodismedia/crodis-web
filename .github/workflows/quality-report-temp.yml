name: Quality Report Temp

on:
  push:
    paths:
      - '.github/workflows/quality-report-temp.yml'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
      - run: npm install
      - name: Run Quality Guard report
        run: |
          node quality-guard.cjs
          latest=$(ls -1t quality-reports/*.json | head -n1)
          echo "LATEST_REPORT=$latest"
          cat "$latest"
