name: Generar talleres estáticos temporales

on:
  push:
    paths:
      - '.github/workflows/generate-static-talleres-temporal.yml'
      - 'scripts/generate-static-talleres-temporal.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generar fichas estáticas limpias
        run: node scripts/generate-static-talleres-temporal.mjs
      - name: Verificar HTML limpio
        shell: bash
        run: |
          count=$(find talleres-temporal -mindepth 2 -maxdepth 2 -type f -name 'index.html' | wc -l)
          echo "Fichas temporales: $count"
          test "$count" -gt 0
          if grep -RIl '<meta name="robots" content="noindex' talleres-temporal --include='index.html'; then
            echo 'ERROR: hay fichas con noindex'
            exit 1
          fi
          if grep -REl '/api/|taller-public|taller-html|home-cache-fix|crearTarjeta|supabase\.js|home-public\.js' talleres-temporal --include='index.html'; then
            echo 'ERROR: quedan referencias a constructores/API en las fichas temporales'
            exit 1
          fi
          grep -RIl '<meta name="robots" content="index,follow' talleres-temporal --include='index.html' | head -n 1
      - name: Depositar directorio temporal
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add talleres-temporal/
          if git diff --cached --quiet; then
            echo 'Sin cambios que depositar.'
            exit 0
          fi
          git commit -m 'Generate clean temporary static workshop pages'
          git push
