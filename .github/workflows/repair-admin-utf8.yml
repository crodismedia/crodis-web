name: Repair admin UTF-8 safely

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-admin-utf8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Repair mojibake in admin.js
        run: |
          python -m pip install --quiet ftfy
          python - <<'PY'
          from pathlib import Path
          from ftfy import fix_text

          path = Path('js/admin.js')
          original = path.read_text(encoding='utf-8')
          repaired = fix_text(original)

          suspicious = ('Ă', 'Â', 'â', 'â', 'Ã')
          remaining = [item for item in suspicious if item in repaired]
          if remaining:
              raise SystemExit(f'Suspicious encoding sequences remain: {remaining}')

          path.write_text(repaired, encoding='utf-8', newline='\n')
          PY
      - name: Validate JavaScript syntax
        run: node --check js/admin.js
      - name: Commit repaired file
        run: |
          if git diff --quiet -- js/admin.js; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/admin.js
          git commit -m 'Fix UTF-8 encoding in admin panel'
          git push
