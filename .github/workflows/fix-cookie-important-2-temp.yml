name: Fix Cookie Important 2 Temp

on:
  push:
    paths:
      - '.github/workflows/fix-cookie-important-2-temp.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove redundant hero grid important
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'css/cookie-consent.css';
          let content = fs.readFileSync(file, 'utf8');
          const before = '.hero-contenido { grid-template-columns: minmax(0, 1fr) !important; justify-items: center; }';
          const after = '.hero-contenido { grid-template-columns: minmax(0, 1fr); justify-items: center; }';
          if (!content.includes(before)) throw new Error('Regla esperada no encontrada');
          content = content.replace(before, after);
          fs.writeFileSync(file, content);
          NODE
      - name: Commit fix
        run: |
          git config user.name "TallerMap CSS Fix"
          git config user.email "actions@users.noreply.github.com"
          git add css/cookie-consent.css
          git commit -m "Reducir important de hero contenido"
          git pull --rebase origin main
          git push origin HEAD:main
