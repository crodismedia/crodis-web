name: Sincronizar talleres estáticos

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/sync-editor-v4-static.mjs'
      - 'scripts/sync-editor-v4-static-runner.mjs'
      - 'scripts/filtrar-municipios-con-talleres.mjs'
      - 'scripts/generate-static-municipios.mjs'
      - 'scripts/generate-sitemap-talleres.mjs'
      - 'datos/static-sync-cursor.json'
      - '.github/workflows/sync-static-talleres.yml'

permissions:
  contents: write

concurrency:
  group: sync-static-talleres
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sincronizar fichas cambiadas desde Editor V4
        id: editor_sync
        run: node scripts/sync-editor-v4-static-runner.mjs

      - name: Actualizar páginas municipales estáticas
        if: steps.editor_sync.outputs.changed == 'true'
        run: node scripts/generate-static-municipios.mjs

      - name: Ocultar municipios sin talleres de navegación y buscador
        run: node scripts/filtrar-municipios-con-talleres.mjs --write

      - name: Regenerar sitemap de talleres
        if: steps.editor_sync.outputs.changed == 'true'
        run: node scripts/generate-sitemap-talleres.mjs

      - name: Validar que no se publique contenido dinámico
        run: |
          test -d talleres
          test -f js/catalogo-municipios-estatico.js
          if grep -RIl --include='index.html' -E 'supabaseClient|/rest/v1/|buscar_talleres_municipio' talleres/ | head -n 1 | grep -q .; then
            echo 'ERROR: una ficha pública contiene dependencia dinámica de Supabase/API.'
            exit 1
          fi

      - name: Publicar cambios estáticos
        run: |
          if git diff --quiet; then
            echo "Sin cambios estáticos pendientes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add talleres municipios js/catalogo-municipios-estatico.js sitemap-talleres.xml datos/static-sync-cursor.json
          git commit -m "Publicar cambios estáticos del Editor V4"
          git push
