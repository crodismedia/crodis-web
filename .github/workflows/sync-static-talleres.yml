name: Sincronizar talleres estáticos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerar talleres modificados sin publicar
        run: node scripts/sync-static-talleres.mjs
      - name: Regenerar sitemap sin publicar
        run: node scripts/generate-sitemap-talleres.mjs
