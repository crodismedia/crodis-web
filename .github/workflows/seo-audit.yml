name: SEO Audit + Keyword Optimizer

on:
  push:
    paths:
      - '.github/workflows/seo-audit.yml'
      - 'seo-auditor-global.cjs'
      - 'scripts/seo-keyword-optimizer.cjs'
      - 'scripts/seo-keyword-title-fixer.cjs'
      - 'api/seo-audit.js'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

concurrency:
  group: seo-keyword-optimizer-main
  cancel-in-progress: false

jobs:
  audit-and-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Ejecutar investigación externa y correcciones seguras
        run: |
          node scripts/seo-keyword-optimizer.cjs \
            --external \
            --fix \
            --max=100 \
            --report=seo-reports/latest-keyword-summary.json

      - name: Corregir titles largos que bloquean la keyword
        run: |
          node scripts/seo-keyword-title-fixer.cjs \
            --max=100 \
            --report=seo-reports/latest-title-fixes.json

      - name: Validar sintaxis y cambios
        run: |
          node --check seo-auditor-global.cjs
          node --check scripts/seo-keyword-optimizer.cjs
          node --check scripts/seo-keyword-title-fixer.cjs
          node --check api/seo-audit.js
          git diff --check

      - name: Mostrar resúmenes SEO
        if: always()
        run: |
          echo '=== SEO KEYWORD SUMMARY ==='
          cat seo-reports/latest-keyword-summary.json 2>/dev/null || true
          echo '=== SEO TITLE FIXES ==='
          cat seo-reports/latest-title-fixes.json 2>/dev/null || true

      - name: Guardar correcciones en la fuente
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add -f seo-reports/latest-keyword-summary.json seo-reports/latest-title-fixes.json
          if git diff --cached --quiet; then
            echo 'No hay correcciones SEO persistentes que guardar.'
          else
            echo '=== CAMBIOS QUE SE VAN A GUARDAR ==='
            git diff --cached --stat
            git commit -m 'SEO Auditor: aplicar keywords y guardar verificación [skip ci]'
            git push origin HEAD:main
          fi

      - name: Publicar reportes como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-keyword-report
          path: |
            seo-reports/latest-keyword-summary.json
            seo-reports/latest-title-fixes.json
          if-no-files-found: warn
