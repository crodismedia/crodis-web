name: Quality Check

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
      - run: npm install
      - name: Quality Guard self-repair
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'quality-guard.cjs';
          let content = fs.readFileSync(file, 'utf8');
          const oldBlock = `      // Contar imágenes\n      const imgMatches = content.match(/<img/g) || [];\n      this.metrics.imagesTotal += imgMatches.length;\n      const imgWithoutAlt = content.match(/<img(?!.*alt=)/gi) || [];\n      this.metrics.imagesWithoutAlt += imgWithoutAlt.length;`;
          const newBlock = `      // Contar imágenes usando la etiqueta completa, también si ocupa varias líneas\n      const imgTags = content.match(/<img\\b[^>]*>/gis) || [];\n      this.metrics.imagesTotal += imgTags.length;\n      const imgWithoutAlt = imgTags.filter(tag => !/\\balt\\s*=/i.test(tag));\n      this.metrics.imagesWithoutAlt += imgWithoutAlt.length;`;
          if (content.includes(oldBlock)) {
            content = content.replace(oldBlock, newBlock);
            fs.writeFileSync(file, content);
            console.log('Quality Guard: contador de imágenes autocorregido');
          } else {
            console.log('Quality Guard: contador ya corregido o bloque no encontrado');
          }
          NODE
      - name: Run Quality Guard fixes
        run: npm run quality:fix
      - name: Commit Quality Guard fixes
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "TallerMap Quality Guard"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Quality Guard: aplicar correcciones automáticas"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Verify with Quality Guard
        run: |
          node quality-guard.cjs
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const dir = 'quality-reports';
          const reports = fs.existsSync(dir)
            ? fs.readdirSync(dir).filter(f => f.endsWith('.json')).sort()
            : [];
          if (!reports.length) {
            console.error('No se encontró reporte JSON del Quality Guard');
            process.exit(1);
          }
          const latest = JSON.parse(fs.readFileSync(path.join(dir, reports[reports.length - 1]), 'utf8'));
          const errors = latest?.summary?.errors ?? latest?.metrics?.totalErrors ?? 0;
          if (errors > 0) {
            console.error(`Quality Guard: ${errors} error(es) pendiente(s)`);
            process.exit(1);
          }
          console.log(`Quality Guard verificado: 0 errores; ${latest?.summary?.warnings ?? 0} advertencias registradas`);
          NODE
