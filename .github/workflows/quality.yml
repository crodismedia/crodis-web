name: Quality Check

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - name: Quality Guard self-repair
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'quality-guard.cjs';
          let content = fs.readFileSync(file, 'utf8');
          let changed = false;

          const oldImageBlock = `      // Contar imágenes\n      const imgMatches = content.match(/<img/g) || [];\n      this.metrics.imagesTotal += imgMatches.length;\n      const imgWithoutAlt = content.match(/<img(?!.*alt=)/gi) || [];\n      this.metrics.imagesWithoutAlt += imgWithoutAlt.length;`;
          const newImageBlock = `      // Contar imágenes usando la etiqueta completa, también si ocupa varias líneas\n      const imgTags = content.match(/<img\\b[^>]*>/gis) || [];\n      this.metrics.imagesTotal += imgTags.length;\n      const imgWithoutAlt = imgTags.filter(tag => !/\\balt\\s*=/i.test(tag));\n      this.metrics.imagesWithoutAlt += imgWithoutAlt.length;`;
          if (content.includes(oldImageBlock)) {
            content = content.replace(oldImageBlock, newImageBlock);
            changed = true;
            console.log('Quality Guard: contador de imágenes autocorregido');
          }

          const oldCssBlock = `    // 1. Verificar duplicación de propiedades\n    const propRegex = /([a-zA-Z-]+)\\s*:/g;\n    const props = {};\n    let match;\n    while ((match = propRegex.exec(content)) !== null) {\n      const prop = match[1];\n      props[prop] = (props[prop] || 0) + 1;\n    }\n\n    const duplicatedProps = Object.entries(props).filter(([_, count]) => count > 5);\n    if (duplicatedProps.length > 0) {\n      issues.push({\n        type: 'css',\n        severity: 'warning',\n        line: 0,\n        message: \`Propiedades CSS duplicadas: \${duplicatedProps.map(([p, c]) => \`\${p}(\${c})\`).join(', ')}\`\n      });\n    }`;
          const newCssBlock = `    // 1. Verificar propiedades realmente duplicadas dentro del mismo bloque CSS\n    const duplicatedDeclarations = [];\n    const blockRegex = /([^{}]+)\\{([^{}]*)\\}/g;\n    let blockMatch;\n    while ((blockMatch = blockRegex.exec(content)) !== null) {\n      const selector = blockMatch[1].trim().replace(/\\s+/g, ' ');\n      const body = blockMatch[2];\n      const propRegex = /(?:^|;)\\s*([a-zA-Z-]+)\\s*:/g;\n      const props = {};\n      let propMatch;\n      while ((propMatch = propRegex.exec(body)) !== null) {\n        const prop = propMatch[1].toLowerCase();\n        props[prop] = (props[prop] || 0) + 1;\n      }\n      const repeated = Object.entries(props).filter(([_, count]) => count > 1);\n      if (repeated.length > 0) {\n        duplicatedDeclarations.push({ selector, repeated });\n      }\n    }\n\n    if (duplicatedDeclarations.length > 0) {\n      const details = duplicatedDeclarations\n        .slice(0, 10)\n        .map(({ selector, repeated }) => \`\${selector}: \${repeated.map(([p, c]) => \`\${p}(\${c})\`).join(', ')}\`)\n        .join(' | ');\n      issues.push({\n        type: 'css',\n        severity: 'warning',\n        line: 0,\n        message: \`Propiedades CSS duplicadas dentro del mismo bloque: \${details}\`\n      });\n    }`;
          if (content.includes(oldCssBlock)) {
            content = content.replace(oldCssBlock, newCssBlock);
            changed = true;
            console.log('Quality Guard: detector de duplicación CSS autocorregido');
          }

          if (changed) {
            fs.writeFileSync(file, content);
          } else {
            console.log('Quality Guard: reglas ya corregidas o bloques no encontrados');
          }
          NODE
      - name: Run Quality Guard fixes
        run: npm run quality:fix
      - name: Commit Quality Guard fixes
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "TallerMap Quality Guard"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Quality Guard: aplicar correcciones automáticas"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Verify with Quality Guard
        run: |
          node quality-guard.cjs
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const dir = 'quality-reports';
          const reports = fs.existsSync(dir)
            ? fs.readdirSync(dir).filter(f => f.endsWith('.json')).sort()
            : [];
          if (!reports.length) {
            console.error('No se encontró reporte JSON del Quality Guard');
            process.exit(1);
          }
          const latest = JSON.parse(fs.readFileSync(path.join(dir, reports[reports.length - 1]), 'utf8'));
          const errors = latest?.summary?.errors ?? latest?.metrics?.totalErrors ?? 0;
          const warnings = latest?.summary?.warnings ?? 0;
          console.log(`Quality Guard verificado: ${errors} errores; ${warnings} advertencias registradas`);
          console.log('Quality Guard: detalle del reporte JSON');
          console.log(JSON.stringify(latest, null, 2));
          if (errors > 0) process.exit(1);
          NODE
