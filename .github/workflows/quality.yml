name: Quality Check

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
      - run: npm install
      - name: Run Quality Guard fixes
        run: npm run quality:fix
      - name: Commit Quality Guard fixes
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "TallerMap Quality Guard"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Quality Guard: aplicar correcciones automáticas"
            git push
          fi
      - name: Verify with Quality Guard
        run: npm run quality:ci
