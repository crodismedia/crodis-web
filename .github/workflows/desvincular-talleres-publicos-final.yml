name: Desvincular talleres públicos definitivamente

on:
  push:
    paths:
      - 'scripts/desvincular-talleres-publicos-final.mjs'
      - '.github/workflows/desvincular-talleres-publicos-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Desvincular stack público de talleres
        run: node scripts/desvincular-talleres-publicos-final.mjs
      - name: Verificar fichas temporales
        shell: bash
        run: |
          count=$(find talleres-temporal -mindepth 2 -maxdepth 2 -type f -name 'index.html' | wc -l)
          echo "Fichas temporales: $count"
          test "$count" -gt 0
      - name: Depositar limpieza y retirar herramienta
        shell: bash
        run: |
          rm -f scripts/desvincular-talleres-publicos-final.mjs
          rm -f .github/workflows/desvincular-talleres-publicos-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fully unlink public workshop stack from dynamic renderers'
          git push
