name: Generar talleres temporales v2
on:
  push:
    paths:
      - '.github/workflows/generate-static-talleres-temporal-v2.yml'
      - 'scripts/generate-static-talleres-temporal-v2.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/generate-static-talleres-temporal-v2.mjs
      - name: Verificar
        shell: bash
        run: |
          count=$(find talleres-temporal -mindepth 2 -maxdepth 2 -type f -name 'index.html' | wc -l)
          echo "Fichas temporales: $count"
          test "$count" -gt 0
          ! grep -RIl '<meta name="robots" content="noindex' talleres-temporal --include='index.html'
          ! grep -REl '/api/|taller-public|taller-html|home-cache-fix|crearTarjeta|supabase\.js|home-public\.js' talleres-temporal --include='index.html'
      - name: Depositar
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add talleres-temporal/
          git diff --cached --quiet && exit 0
          git commit -m 'Generate clean temporary static workshop pages v2'
          git push
