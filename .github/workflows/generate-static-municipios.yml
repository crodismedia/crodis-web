name: Generar sitemap municipal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'municipios/**'
      - 'scripts/generate-sitemap-municipios.mjs'
      - '.github/workflows/generate-static-municipios.yml'

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar 542 HTML municipales y generar sitemap
        run: node scripts/generate-sitemap-municipios.mjs
      - name: Publicar sitemap municipal si cambia
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- sitemap-municipios.xml)" ]; then
            echo 'sitemap-municipios.xml ya está actualizado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap-municipios.xml
          git commit -m 'Generate municipal sitemap'
          git push
