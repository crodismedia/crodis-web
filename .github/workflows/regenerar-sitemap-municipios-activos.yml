name: Regenerar sitemap de municipios activos

on:
  push:
    paths:
      - '.github/workflows/regenerar-sitemap-municipios-activos.yml'

permissions:
  contents: write

jobs:
  regenerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerar sitemap de municipios
        run: node scripts/generate-sitemap-municipios.mjs
      - name: Guardar sitemap
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap-municipios.xml
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar"
            exit 0
          fi
          git commit -m "Publicar sitemap de municipios con talleres"
          git push
