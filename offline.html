<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin conexión - TallerMap</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 400px; }
        .icon { font-size: 80px; margin-bottom: 20px; display: block; }
        h1 { font-size: 28px; margin-bottom: 12px; color: #f8fafc; }
        p { font-size: 16px; line-height: 1.6; color: #94a3b8; }
        .btn {
            display: inline-block;
            margin-top: 24px;
            padding: 14px 32px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover { background: #1d4ed8; transform: scale(1.05); }
        .footer { margin-top: 40px; font-size: 12px; color: #475569; }
    </style>
</head>
<body>
    <div class="container">
        <span class="icon">📡</span>
        <h1>Sin conexión</h1>
        <p>Vuelve a intentarlo cuando tengas conexión.</p>
        <div>
            <button class="btn" onclick="window.location.reload()">🔄 Reintentar</button>
        </div>
        <div class="footer">TallerMap • Modo offline</div>
    </div>
</body>
</html>
