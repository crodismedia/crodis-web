<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel desguace | TallerMap</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/css/estilo.css?v=20260809-5"><style>body{background:#f5f7fa;color:#172033}.wrap{max-width:1180px;margin:28px auto;padding:0 18px 70px}.topline{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 14px;border:0;border-radius:9px;font-weight:800;cursor:pointer;text-decoration:none}.primary{background:#155eef;color:#fff}.soft{background:#f2f4f7;color:#344054}.status{padding:12px 14px;border-radius:10px;background:#fff;border:1px solid #e4e7ec;margin-bottom:16px}.grid{display:grid;gap:14px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:20px;box-shadow:0 8px 22px rgba(16,24,40,.05)}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.badge{padding:6px 10px;border-radius:999px;background:#eff8ff;color:#175cd3;font-weight:800;font-size:.8rem}.meta{color:#667085;font-size:.9rem}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.details p{margin:0;padding:8px 0;border-bottom:1px solid #eaecf0}.photos{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.photos img{width:150px;height:110px;object-fit:cover;border-radius:10px;border:1px solid #e4e7ec}.manage{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid #eaecf0}.manage .full{grid-column:1/-1}.manage label{display:grid;gap:5px;font-weight:700}.manage input,.manage select,.manage textarea{padding:10px;border:1px solid #d0d5dd;border-radius:9px;font:inherit}.manage textarea{min-height:90px}.empty{padding:26px;text-align:center;color:#667085}.err{color:#b42318}.ok{color:#027a48}@media(max-width:760px){.details,.manage{grid-template-columns:1fr}.manage .full{grid-column:auto}.head,.topline{flex-direction:column;align-items:stretch}}</style></head><body><header class="cabecera"><div class="contenedor cabecera-contenido"><a href="/" class="marca"><img class="marca-icono marca-icono-logo" src="/favicon.svg" alt="TallerMap" width="46" height="46"><span class="marca-texto"><strong>TallerMap</strong><small>Panel desguace</small></span></a><nav class="menu"><a href="/desguaces.html">Desguaces</a><button id="logout" class="btn soft" type="button">Cerrar sesión</button></nav></div></header><main class="wrap"><div class="topline"><div><p class="meta">Área profesional</p><h1 id="titulo">Solicitudes recibidas</h1></div><button id="recargar" class="btn primary" type="button">Recargar</button></div><div id="estado" class="status">Cargando panel…</div><div id="lista" class="grid"></div></main><script>
(function(){const token=()=>localStorage.getItem('tm_desguace_access_token')||'';const estado=document.getElementById('estado'),lista=document.getElementById('lista'),titulo=document.getElementById('titulo');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function label(e){return({recibida:'Solicitud recibida',en_revision:'En revisión',disponible:'Pieza disponible',no_disponible:'Pieza no disponible',cerrada:'Solicitud cerrada'})[e]||e}function dinero(v){return v===null||v===undefined?'':Number(v).toFixed(2)}async function api(method='GET',body){const t=token();if(!t){location.replace('/acceso-desguaces.html');return}const r=await fetch('/api/panel-desguace',{method,headers:{Authorization:`Bearer ${t}`,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem('tm_desguace_access_token');localStorage.removeItem('tm_desguace_refresh_token');location.replace('/acceso-desguaces.html');return}if(!r.ok||!d.ok)throw new Error(d.error||'No se pudo cargar el panel.');return d}function card(s){const veh=[s.marca,s.modelo,s.anio].filter(Boolean).join(' ')||'—';const fotos=(s.fotos||[]).map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="Foto adjunta de la solicitud"></a>`).join('');return `<article class="card" data-id="${esc(s.id)}"><div class="head"><div><h2>${esc(s.pieza||'Solicitud de pieza')}</h2><div class="meta">${esc(s.codigo)} · ${new Date(s.created_at).toLocaleString('es-ES')}</div></div><span class="badge">${esc(label(s.estado))}</span></div><div class="details"><div><p><strong>Cliente:</strong> ${esc(s.nombre_cliente||'—')}</p><p><strong>Teléfono:</strong> ${esc(s.telefono||'—')}</p><p><strong>Email:</strong> ${esc(s.email||'—')}</p><p><strong>Vehículo:</strong> ${esc(veh)}</p><p><strong>Matrícula:</strong> ${esc(s.matricula||'—')}</p><p><strong>VIN:</strong> ${esc(s.vin||'—')}</p></div><div><p><strong>Motor:</strong> ${esc(s.motor_version||'—')}</p><p><strong>Lado:</strong> ${esc(s.lado||'—')}</p><p><strong>Preferencia:</strong> ${esc(s.preferencia_pieza||'—')}</p><p><strong>Referencia:</strong> ${esc(s.referencia_pieza||'—')}</p><p><strong>Observaciones:</strong> ${esc(s.observaciones||'—')}</p></div></div>${fotos?`<div class="photos">${fotos}</div>`:''}<form class="manage"><label>Estado<select name="estado"><option value="recibida" ${s.estado==='recibida'?'selected':''}>Solicitud recibida</option><option value="en_revision" ${s.estado==='en_revision'?'selected':''}>En revisión</option><option value="disponible" ${s.estado==='disponible'?'selected':''}>Pieza disponible</option><option value="no_disponible" ${s.estado==='no_disponible'?'selected':''}>Pieza no disponible</option><option value="cerrada" ${s.estado==='cerrada'?'selected':''}>Cerrada</option></select></label><label>Entrega<input name="entrega" value="${esc(s.entrega||'')}" placeholder="Recogida, envío 24/48 h..."></label><label>Precio €<input name="precio" type="number" min="0" step="0.01" value="${esc(dinero(s.precio))}"></label><label>Gastos de envío €<input name="gastos_envio" type="number" min="0" step="0.01" value="${esc(dinero(s.gastos_envio))}"></label><label class="full">Respuesta al cliente<textarea name="resultado">${esc(s.resultado||'')}</textarea></label><div class="full"><button class="btn primary" type="submit">Guardar respuesta</button> <span class="save-status"></span></div></form></article>`}async function cargar(){estado.className='status';estado.textContent='Cargando panel…';lista.innerHTML='';try{const d=await api();if(!d)return;titulo.textContent=`Solicitudes · ${d.desguace?.nombre||'Desguace'}`;estado.textContent=`${d.solicitudes.length} ${d.solicitudes.length===1?'solicitud':'solicitudes'} recibidas`;lista.innerHTML=d.solicitudes.length?d.solicitudes.map(card).join(''):'<div class="card empty">Todavía no hay solicitudes.</div>';document.querySelectorAll('.manage').forEach(f=>f.addEventListener('submit',guardar));}catch(e){estado.className='status err';estado.textContent=e.message}}async function guardar(e){e.preventDefault();const f=e.currentTarget,art=f.closest('[data-id]'),out=f.querySelector('.save-status');out.className='save-status';out.textContent='Guardando…';const fd=new FormData(f);const body={id:art.dataset.id,estado:fd.get('estado'),entrega:fd.get('entrega'),precio:fd.get('precio'),gastos_envio:fd.get('gastos_envio'),resultado:fd.get('resultado')};try{await api('PATCH',body);out.className='save-status ok';out.textContent='Guardado';setTimeout(cargar,500)}catch(err){out.className='save-status err';out.textContent=err.message}}document.getElementById('recargar').addEventListener('click',cargar);document.getElementById('logout').addEventListener('click',()=>{localStorage.removeItem('tm_desguace_access_token');localStorage.removeItem('tm_desguace_refresh_token');location.replace('/acceso-desguaces.html')});cargar();})();
</script></body></html>
